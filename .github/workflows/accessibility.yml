name: Accessibility

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: accessibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  accessibility:
    name: WCAG audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: https://science-lab-tools.example
      NEXT_TELEMETRY_DISABLED: "1"
      A11Y_BASE_URL: http://127.0.0.1:3000

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright-core install --with-deps chromium

      - name: Build production application
        run: pnpm build

      - name: Audit representative pages
        shell: bash
        run: |
          pnpm start > /tmp/science-lab-tools-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error "$A11Y_BASE_URL" > /dev/null; then
              break
            fi

            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/science-lab-tools-server.log
              exit 1
            fi

            if [ "$attempt" -eq 30 ]; then
              cat /tmp/science-lab-tools-server.log
              exit 1
            fi

            sleep 1
          done

          CHROMIUM_PATH="$(node -e "const { chromium } = require('playwright-core'); process.stdout.write(chromium.executablePath())")" \
            pnpm check:a11y
