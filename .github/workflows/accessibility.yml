name: Accessibility

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: accessibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  accessibility:
    name: WCAG audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: https://science-lab-tools.example
      NEXT_TELEMETRY_DISABLED: "1"
      A11Y_BASE_URL: http://127.0.0.1:3000

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright-core install --with-deps chromium

      - name: Build production application
        run: pnpm build

      - name: Audit representative pages
        shell: bash
        run: |
          pnpm start > /tmp/science-lab-tools-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error "$A11Y_BASE_URL" > /dev/null; then
              break
            fi

            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/science-lab-tools-server.log
              exit 1
            fi

            if [ "$attempt" -eq 30 ]; then
              cat /tmp/science-lab-tools-server.log
              exit 1
            fi

            sleep 1
          done

          CHROMIUM_PATH="$(node -e "const { chromium } = require('playwright-core'); process.stdout.write(chromium.executablePath())")" \
            pnpm check:a11y
