name: Production Smoke

on:
  workflow_dispatch:
    inputs:
      live_site_url:
        description: Production URL to verify
        required: false
        default: https://alh.sciencecalchub.org

permissions:
  contents: read

jobs:
  smoke:
    name: Verify live production site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LIVE_SITE_URL: ${{ inputs.live_site_url || 'https://alh.sciencecalchub.org' }}
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.13.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify HTTPS and primary routes
        shell: bash
        run: |
          set -euo pipefail
          for path in / /robots.txt /sitemap.xml /calculators /lab-reports /scientific-method /templates; do
            url="${LIVE_SITE_URL%/}${path}"
            echo "Checking $url"
            curl --fail --silent --show-error --location --max-time 20 "$url" > /dev/null
          done

      - name: Crawl live SEO output
        run: pnpm seo:audit:live

      - name: Upload live audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-seo-crawl
          path: /tmp/live-seo-crawl.json
          if-no-files-found: ignore
