name: Production Smoke

on:
  workflow_dispatch:
    inputs:
      live_site_url:
        description: Production URL to verify
        required: false
        default: https://alh.sciencecalchub.org

permissions:
  contents: read

jobs:
  smoke:
    name: Verify live production site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LIVE_SITE_URL: ${{ inputs.live_site_url || 'https://alh.sciencecalchub.org' }}
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify HTTPS and primary routes
        shell: bash
        run: |
          set -euo pipefail
          for path in / /robots.txt /sitemap.xml /calculators /lab-reports /scientific-method /templates; do
            url="${LIVE_SITE_URL%/}${path}"
            echo "Checking $url"
            curl --fail --silent --show-error --location --max-time 20 "$url" > /dev/null
          done

      - name: Crawl live SEO output
        run: pnpm seo:audit:live

      - name: Upload live audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-seo-crawl
          path: /tmp/live-seo-crawl.json
          if-no-files-found: ignore
